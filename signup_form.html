<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .signup-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #007bff;
        }
        .alert {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="signup-container">
        <h2 class="text-center mb-4"><i class="fa-solid fa-user-plus"></i> Sign Up</h2>

        <div id="successMessage" class="alert alert-success" role="alert">
            <i class="fa-solid fa-circle-check"></i> Registration Successful! Welcome to our platform.
        </div>

        <div id="errorMessage" class="alert alert-danger" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i> Error: Please check your input.
        </div>

        <form id="signupForm">
            <div class="mb-3">
                <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>
            </div>
            <div class="mb-3">
                <label for="passwordConfirm" class="form-label"><i class="fa-solid fa-key"></i> Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="Confirm your password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-user-check"></i> Sign Up</button>
        </form>
    </div>
</div>

<script>
    // Giả lập database bằng object
    let usersDatabase = {};

    document.getElementById("signupForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Ngăn chặn reload trang

        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let passwordConfirm = document.getElementById("passwordConfirm").value;
        let successMessage = document.getElementById("successMessage");
        let errorMessage = document.getElementById("errorMessage");

        // Reset thông báo
        successMessage.style.display = "none";
        errorMessage.style.display = "none";

        // Kiểm tra hợp lệ
        if (!email || !password || !passwordConfirm) {
            errorMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> All fields are required!';
            errorMessage.style.display = "block";
            return;
        }
        if (password !== passwordConfirm) {
            errorMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Passwords do not match!';
            errorMessage.style.display = "block";
            return;
        }
        if (email in usersDatabase) {
            errorMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Email is already registered!';
            errorMessage.style.display = "block";
            return;
        }

        // Lưu user vào object database giả lập
        usersDatabase[email] = { password: password };

        // Hiển thị thông báo thành công
        successMessage.style.display = "block";

        // Xóa input sau khi đăng ký
        document.getElementById("signupForm").reset();

        console.log("User Database:", usersDatabase);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
